<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocotzBOT - Free Trial</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0f19; color: #ffffff; margin: 0; }
        .container { background: #111827; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 420px; text-align: center; box-sizing: border-box; border: 1px solid #1f2937; }
        h2 { margin-bottom: 5px; color: #ffffff; font-size: 24px; font-weight: 700; }
        .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 25px; }
        .bold-green { color: #10b981; font-weight: bold; }
        label { display: block; text-align: left; font-size: 14px; color: #9ca3af; margin-bottom: 6px; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 16px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-container { margin-top: 25px; display: none; text-align: left; }
        .status-msg { color: #10b981; font-size: 14px; font-weight: 500; margin-bottom: 8px; text-align: center; }
        .key-box { background: #064e3b; border: 1px solid #059669; color: #a7f3d0; padding: 15px; border-radius: 8px; font-family: monospace; word-break: break-all; font-size: 13px; cursor: pointer; text-align: center; max-height: 150px; overflow-y: auto; }
        .hint { font-size: 11px; color: #6b7280; text-align: center; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Automated Trial</h2>
    <div class="subtitle">Maximize your village without hassle.</div>
    
    <label for="hwidInput">Hardware ID (HWID)</label>
    <input type="text" id="hwidInput" placeholder="Masukkan HWID Anda">
    <button id="btnRequest" onclick="ambilKeyBypass()">Request Trial Key</button>

    <div id="resultContainer" class="result-container">
        <div id="statusMsg" class="status-msg"></div>
        <div id="keyBox" class="key-box" onclick="salinKey()"></div>
        <div class="hint">Tap the code above to copy.</div>
    </div>
</div>

<script>
async function ambilKeyBypass() {
    const hwid = document.getElementById('hwidInput').value.trim();
    const resultContainer = document.getElementById('resultContainer');
    const statusMsg = document.getElementById('statusMsg');
    const keyBox = document.getElementById('keyBox');
    const btn = document.getElementById('btnRequest');
    
    if (!hwid) return alert("HWID wajib diisi!");

    btn.disabled = true;
    btn.innerText = "Bypassing CORS Security...";
    resultContainer.style.display = "none";

    // Bikin email random otomatis
    const randomString = Math.random().toString(36).substring(2, 12);
    const randomEmail = `${randomString}@gmail.com`;

    // ⚠️ ALAMAT API TARGET ASLI COCOTZBOT
    const targetUrl = "https://n123.web.id";
    
    // ⚠️ PROXY JALUR KHUSUS UNTUK MENEMBUS BLOKIR CORS BROWSER
    const proxyUrl = "https://herokuapp.com";

    try {
        // Menembak ke API pusat lewat jembatan Cors-Anywhere
        const response = await fetch(proxyUrl + targetUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Requested-With": "XMLHttpRequest",
                "Origin": "https://n123.web.id",
                "Referer": "https://n123.web.id/"
            },
            body: JSON.stringify({
                email: randomEmail,
                hwid: hwid
            })
        });

        const textData = await response.text();
        
        btn.disabled = false;
        btn.innerText = "Request Trial Key";
        resultContainer.style.display = "block";

        // Jika akses proxy penuh atau butuh aktivasi sementara
        if (textData.includes("See /corsdemo")) {
            statusMsg.style.color = "#ef4444";
            statusMsg.innerText = "Aktivasi Proxy Diperlukan!";
            keyBox.innerText = "Buka tautan https://herokuapp.comcorsdemo di tab baru Chrome Anda, klik tombol 'Request temporary access', lalu coba klik request key lagi di web ini.";
            return;
        }

        try {
            const data = JSON.parse(textData);
            
            if (data.token || data.key || data.data) {
                statusMsg.style.color = "#10b981";
                statusMsg.innerHTML = "Trial successful! Active for <span class='bold-green'>2 Days</span>";
                keyBox.innerText = data.token || data.key || data.data;
            } else {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = data.message || "Gagal! HWID mungkin sudah terdaftar.";
                keyBox.innerText = textData;
            }
        } catch (e) {
            statusMsg.style.color = "#ef4444";
            statusMsg.innerText = "Server pusat mendeteksi request otomatis.";
            keyBox.innerText = textData;
        }

    } catch (error) {
        btn.disabled = false;
        btn.innerText = "Request Trial Key";
        resultContainer.style.display = "block";
        statusMsg.style.color = "#ef4444";
        statusMsg.innerText = "Proxy Connection Error!";
        keyBox.innerText = error.message;
    }
}

function salinKey() {
    const txt = document.getElementById('keyBox').innerText;
    navigator.clipboard.writeText(txt).then(() => alert("Key berhasil disalin!"));
}
</script>

</body>
</html>
